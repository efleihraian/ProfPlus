name: Security checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'
permissions:
  contents: read
jobs:
  library-import-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: python3 -m venv .venv-ci
      - run: .venv-ci/bin/python -m pip install -r scripts/requirements-rag.txt
      - run: .venv-ci/bin/python -m unittest tests.test_manual_recovery tests.test_cloud_library tests.test_manual_import tests.test_competition_import
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - run: python3 scripts/security_scan.py --history
  dependencies-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm run install:ci
      - run: npx tsc --noEmit
      - run: npm run build
      - run: python3 ../scripts/security_scan.py --client
      - run: npm run test:account
      - run: node tests/guest-chat.mjs
      - run: npm run test:manual-library
      - run: node tests/library-availability.mjs
      - run: npm audit --audit-level=high
